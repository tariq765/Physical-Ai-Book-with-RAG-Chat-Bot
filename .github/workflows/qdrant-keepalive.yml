name: Keep Qdrant Cloud Cluster Alive

on:
  schedule:
    # Run every 12 hours (twice a day) to prevent Qdrant Cloud free-tier deactivation
    - cron: '0 */12 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Qdrant - List Collections
        run: |
          echo "=== Listing Qdrant Collections ==="
          RESPONSE=$(curl -f -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${{ secrets.QDRANT_URL }}/collections" \
            -H "api-key: ${{ secrets.QDRANT_API_KEY }}")
          echo "$RESPONSE"

      - name: Ping Qdrant - Collection Info
        run: |
          echo "=== Checking Collection: physical_ai_book_v2 ==="
          RESPONSE=$(curl -f -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${{ secrets.QDRANT_URL }}/collections/physical_ai_book_v2" \
            -H "api-key: ${{ secrets.QDRANT_API_KEY }}")
          echo "$RESPONSE"

      - name: Ping Qdrant - Scroll Points (Active Usage)
        run: |
          echo "=== Scrolling first 5 points to simulate active usage ==="
          RESPONSE=$(curl -f -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.QDRANT_URL }}/collections/physical_ai_book_v2/points/scroll" \
            -H "api-key: ${{ secrets.QDRANT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"limit": 5, "with_payload": true, "with_vector": false}')
          echo "$RESPONSE"

      - name: Ping HuggingFace Space Backend
        run: |
          echo "=== Pinging HF Space Root ==="
          curl -f -s "https://tariq761-pjysical-ai-ragchatbot.hf.space/" || echo "HF Space may be sleeping, that's OK"
          echo ""
          echo "=== Pinging HF Space /health (triggers Qdrant check from backend) ==="
          curl -f -s "https://tariq761-pjysical-ai-ragchatbot.hf.space/health" || echo "HF Space health check unavailable"
